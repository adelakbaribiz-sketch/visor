services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: visor
      POSTGRES_PASSWORD: visor
      POSTGRES_DB: visor
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visor -d visor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://visor:visor@postgres:5432/visor?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique value of 32+ chars, e.g. JWT_SECRET=$(openssl rand -hex 32) docker compose up}
      PORT: 4100
      CORS_ORIGIN: http://localhost:3400
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4100
    ports:
      - "3400:3000"
    depends_on:
      - api

volumes:
  postgres-data:
